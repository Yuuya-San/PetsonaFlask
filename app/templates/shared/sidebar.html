<aside class="main-sidebar sidebar-dark-primary elevation-4">

    <span class="brand-text font-weight-light">{{ brand_text or 'PetSona' }}</span>
  </a>

  <div class="sidebar">
    <nav class="mt-2">
      <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" data-accordion="false" role="menu">
        {% include 'shared/sidebar/' ~ sidebar_variant ~ '.html' %}
      </ul>
    </nav>
  </div>
</aside>
